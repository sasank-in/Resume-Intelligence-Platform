name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (syntax only, non-blocking)
        run: |
          python -m compileall -q app src main.py
        continue-on-error: false

      - name: Run tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'test-key-not-used-with-mocks' }}
          ENV: test
          LOG_LEVEL: WARNING
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t resume-summarizer:ci .
