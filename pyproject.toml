[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "static",
    "docs",
    "src/_logprint.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401"]
"src/**/*.py" = ["F821"]   # auto-injected `print = make_log_print(...)`

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
(
    static/.*
  | docs/.*
  | src/_logprint\.py
)
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
